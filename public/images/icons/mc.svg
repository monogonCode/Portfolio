<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Pixel-art isometric/front grass block -->
  <rect x="6" y="6" width="52" height="52" rx="6" fill="#5b3b1e" stroke="#2d1d0e" stroke-width="3"/>
  <!-- Top grass layer -->
  <rect x="8" y="8" width="48" height="16" fill="#4aa02c"/>
  <rect x="8" y="8" width="48" height="6" fill="#63c74d"/>
  <!-- Overhanging grass pixels -->
  <rect x="8" y="24" width="8" height="6" fill="#4aa02c"/>
  <rect x="20" y="24" width="6" height="8" fill="#4aa02c"/>
  <rect x="32" y="24" width="8" height="5" fill="#4aa02c"/>
  <rect x="44" y="24" width="12" height="7" fill="#4aa02c"/>
  <!-- Dirt texture pixels -->
  <rect x="12" y="34" width="6" height="6" fill="#7a512a"/>
  <rect x="24" y="38" width="8" height="6" fill="#452b14"/>
  <rect x="40" y="36" width="6" height="6" fill="#7a512a"/>
  <rect x="14" y="46" width="8" height="6" fill="#452b14"/>
  <rect x="32" y="48" width="6" height="6" fill="#7a512a"/>
  <rect x="46" y="44" width="6" height="6" fill="#452b14"/>
  <!-- Subtle highlight -->
  <rect x="10" y="10" width="8" height="4" fill="#8ae26b"/>
  <rect x="24" y="10" width="10" height="4" fill="#8ae26b"/>
</svg>
