<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="gladosGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc" />
      <stop offset="35%" stop-color="#ffbf00" />
      <stop offset="70%" stop-color="#e65100" />
      <stop offset="100%" stop-color="#3e1b00" />
    </radialGradient>
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Base Chassis / Ring -->
  <circle cx="32" cy="32" r="30" fill="#1e2229" stroke="#374151" stroke-width="2.5" />
  <circle cx="32" cy="32" r="26" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
  
  <!-- Aperture Blades -->
  <path d="M 32 6 L 44 14 L 38 24 Z" fill="#374151" opacity="0.8" />
  <path d="M 54 22 L 56 36 L 44 34 Z" fill="#374151" opacity="0.8" />
  <path d="M 52 46 L 40 54 L 34 44 Z" fill="#374151" opacity="0.8" />
  <path d="M 28 58 L 14 52 L 20 42 Z" fill="#374151" opacity="0.8" />
  <path d="M 8 38 L 8 24 L 20 28 Z" fill="#374151" opacity="0.8" />
  <path d="M 16 14 L 28 8 L 30 20 Z" fill="#374151" opacity="0.8" />

  <!-- Inner Iris Housing -->
  <circle cx="32" cy="32" r="17" fill="#030712" stroke="#4b5563" stroke-width="1.5" />
  
  <!-- Glowing GLaDOS Eye Core -->
  <circle cx="32" cy="32" r="12" fill="url(#gladosGlow)" filter="url(#eyeGlow)" />
  
  <!-- Inner Pupil / Reticle -->
  <circle cx="32" cy="32" r="5" fill="#ffffff" opacity="0.9" />
  <circle cx="32" cy="32" r="2.5" fill="#fef08a" />
  <line x1="32" y1="18" x2="32" y2="23" stroke="#fef3c7" stroke-width="1" />
  <line x1="32" y1="41" x2="32" y2="46" stroke="#fef3c7" stroke-width="1" />
  <line x1="18" y1="32" x2="23" y2="32" stroke="#fef3c7" stroke-width="1" />
  <line x1="41" y1="32" x2="46" y2="32" stroke="#fef3c7" stroke-width="1" />
</svg>
