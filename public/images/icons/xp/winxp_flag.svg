<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Red Pane Gradient -->
    <linearGradient id="xpRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b60" />
      <stop offset="40%" stop-color="#ee381e" />
      <stop offset="100%" stop-color="#b81600" />
    </linearGradient>
    <!-- Green Pane Gradient -->
    <linearGradient id="xpGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a4e844" />
      <stop offset="40%" stop-color="#6bb814" />
      <stop offset="100%" stop-color="#468205" />
    </linearGradient>
    <!-- Blue Pane Gradient -->
    <linearGradient id="xpBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" />
      <stop offset="40%" stop-color="#0288d1" />
      <stop offset="100%" stop-color="#01579b" />
    </linearGradient>
    <!-- Yellow Pane Gradient -->
    <linearGradient id="xpYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="40%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#e68a00" />
    </linearGradient>
    <!-- Soft Drop Shadow -->
    <filter id="xpShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#xpShadow)" transform="matrix(0.97 -0.22 0.22 0.97 -6 18)">
    <!-- Red Pane (Top-Left) -->
    <path d="M 12,22 C 26,17 38,25 50,21 L 50,47 C 38,51 26,43 12,48 Z" fill="url(#xpRed)" stroke="#ffffff" stroke-width="0.8" opacity="0.95"/>
    <path d="M 14,24 C 26,19 36,26 48,22" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.4"/>

    <!-- Green Pane (Top-Right) -->
    <path d="M 55,20 C 67,16 79,24 91,20 L 91,46 C 79,50 67,42 55,46 Z" fill="url(#xpGreen)" stroke="#ffffff" stroke-width="0.8" opacity="0.95"/>
    <path d="M 57,22 C 67,18 77,25 89,21" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.4"/>

    <!-- Blue Pane (Bottom-Left) -->
    <path d="M 12,53 C 26,48 38,56 50,52 L 50,78 C 38,82 26,74 12,79 Z" fill="url(#xpBlue)" stroke="#ffffff" stroke-width="0.8" opacity="0.95"/>
    <path d="M 14,55 C 26,50 36,57 48,53" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.4"/>

    <!-- Yellow Pane (Bottom-Right) -->
    <path d="M 55,51 C 67,47 79,55 91,51 L 91,77 C 79,81 67,73 55,77 Z" fill="url(#xpYellow)" stroke="#ffffff" stroke-width="0.8" opacity="0.95"/>
    <path d="M 57,53 C 67,49 77,56 89,52" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.4"/>
  </g>
</svg>